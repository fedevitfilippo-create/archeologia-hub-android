name: Build Archeologia Hub APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica il progetto
        uses: actions/checkout@v4

      - name: Configura Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configura Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Estrai il progetto Android
  run: |
    unzip -o Archeologia_Hub_V24_TRANSCRIZIONE_REALE.zip
    echo "Contenuto progetto:"
    find ArcheologiaHubAndroid -maxdepth 4 -type f
          find ArcheologiaHubAndroid -maxdepth 4 -type f

      - name: Compila APK
        working-directory: ArcheologiaHubAndroid
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Pubblica APK
        uses: actions/upload-artifact@v4
        with:
          name: Archeologia-Hub-APK
          path: ArcheologiaHubAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
