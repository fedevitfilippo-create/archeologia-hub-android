name: Build Archeologia Hub V28

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build APK V28
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # JAVA 17
      # ==========================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # ==========================================
      # GRADLE 8.7
      # ==========================================
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'


      # ==========================================
      # CONTROLLA ZIP V28
      # ==========================================
      - name: Controlla ZIP V28
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo " ARCHEOLOGIA HUB V28"
          echo "=========================================="

          echo ""
          echo "File presenti nel repository:"
          ls -lah

          ZIP="Archeologia_Hub_V28_ALL_FEATURES.zip"

          if [ ! -f "$ZIP" ]; then
            echo ""
            echo "ERRORE:"
            echo "$ZIP non trovato."
            echo ""
            echo "ZIP disponibili:"
            find . -maxdepth 1 -type f -name "*.zip" -printf '%f\n'
            exit 1
          fi

          echo ""
          echo "ZIP V28 trovato:"
          ls -lh "$ZIP"


      # ==========================================
      # ESTRAI PROGETTO
      # ==========================================
      - name: Estrai progetto V28
        shell: bash
        run: |
          set -e

          ZIP="Archeologia_Hub_V28_ALL_FEATURES.zip"

          rm -rf ArcheologiaHubAndroid

          echo "Estrazione V28..."

          unzip -q -o "$ZIP"

          echo ""
          echo "Contenuto estratto:"
          find ArcheologiaHubAndroid -maxdepth 5 -type f | sort


      # ==========================================
      # CONTROLLA STRUTTURA
      # ==========================================
      - name: Verifica struttura Android
        shell: bash
        run: |
          set -e

          echo "Controllo struttura..."

          test -f ArcheologiaHubAndroid/settings.gradle
          test -f ArcheologiaHubAndroid/app/build.gradle
          test -f ArcheologiaHubAndroid/app/src/main/AndroidManifest.xml
          test -f ArcheologiaHubAndroid/app/src/main/java/it/archeologia/hub/MainActivity.java

          echo ""
          echo "Struttura Android OK."


      # ==========================================
      # MOSTRA VERSIONE
      # ==========================================
      - name: Verifica versione V28
        working-directory: ArcheologiaHubAndroid
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo " CONFIGURAZIONE APP"
          echo "=========================================="

          echo ""
          echo "build.gradle:"
          grep -n "applicationId\|versionCode\|versionName\|minSdk\|targetSdk" app/build.gradle || true

          echo ""
          echo "MainActivity:"
          grep -n "appVersion" app/src/main/java/it/archeologia/hub/MainActivity.java || true


      # ==========================================
      # VERIFICA DIPENDENZE
      # ==========================================
      - name: Verifica dipendenze Gradle
        working-directory: ArcheologiaHubAndroid
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo " GRADLE"
          echo "=========================================="

          gradle --version

          echo ""
          echo "Verifica configurazione Gradle..."

          gradle tasks \
            --no-daemon \
            --stacktrace


      # ==========================================
      # CLEAN
      # ==========================================
      - name: Clean
        working-directory: ArcheologiaHubAndroid
        shell: bash
        run: |
          set -e

          echo "Pulizia progetto..."

          gradle clean \
            --no-daemon \
            --stacktrace


      # ==========================================
      # BUILD DEBUG APK
      # ==========================================
      - name: Compila APK V28
        working-directory: ArcheologiaHubAndroid
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo " COMPILAZIONE APK V28"
          echo "=========================================="

          gradle assembleDebug \
            --no-daemon \
            --stacktrace

          echo ""
          echo "Build terminata."


      # ==========================================
      # CERCA APK
      # ==========================================
      - name: Trova APK
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo " APK GENERATI"
          echo "=========================================="

          find ArcheologiaHubAndroid/app/build/outputs \
            -type f \
            -name "*.apk" \
            -print

          APK="ArcheologiaHubAndroid/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo ""
            echo "ERRORE: app-debug.apk non trovato."
            echo ""
            echo "Contenuto build:"
            find ArcheologiaHubAndroid/app/build -type f | sort || true
            exit 1
          fi

          echo ""
          echo "APK TROVATO:"
          ls -lh "$APK"


      # ==========================================
      # UPLOAD APK
      # ==========================================
      - name: Carica APK
        uses: actions/upload-artifact@v4
        with:
          name: Archeologia-Hub-V28-APK
          path: ArcheologiaHubAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30


      # ==========================================
      # FINE
      # ==========================================
      - name: Build completata
        shell: bash
        run: |
          echo ""
          echo "=========================================="
          echo " ARCHEOLOGIA HUB V28"
          echo " BUILD RIUSCITA"
          echo "=========================================="
          echo ""
          echo "Artifact:"
          echo "Archeologia-Hub-V28-APK"
          echo ""
