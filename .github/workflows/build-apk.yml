name: Build Archeologia Hub APK

on:
  workflow_dispatch:
  push:
    paths:
      - "Archeologia_Hub_ANDROID_PROJECT.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Extract Android project
        run: |
          unzip -q Archeologia_Hub_ANDROID_PROJECT.zip
          ls -la
          find ArcheologiaHubAndroid -maxdepth 3 -type f

      - name: Build APK
        working-directory: ArcheologiaHubAndroid
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Archeologia-Hub-APK
          path: ArcheologiaHubAndroid/app/build/outputs/apk/debug/app-debug.apk
