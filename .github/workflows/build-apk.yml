name: Build Archeologia Hub APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    name: Compila Archeologia Hub V25
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Cerca ed estrai V25
        shell: bash
        run: |
          set -e

          ZIP="Archeologia_Hub_V25_TRASCRIZIONE_FIX.zip"

          echo "Controllo presenza del file:"
          ls -lah

          if [ ! -f "$ZIP" ]; then
            echo "ERRORE: $ZIP non trovato."
            echo "I file presenti nella root sono:"
            find . -maxdepth 1 -type f -printf '%f\n'
            exit 1
          fi

          echo "Trovato: $ZIP"
          echo "Estraggo il progetto..."

          rm -rf ArcheologiaHubAndroid
          unzip -q -o "$ZIP"

          echo "Contenuto estratto:"
          find ArcheologiaHubAndroid -maxdepth 5 -type f | sort

          if [ ! -f "ArcheologiaHubAndroid/settings.gradle" ]; then
            echo "ERRORE: settings.gradle non trovato."
            exit 1
          fi

          if [ ! -f "ArcheologiaHubAndroid/app/build.gradle" ]; then
            echo "ERRORE: app/build.gradle non trovato."
            exit 1
          fi

          if [ ! -f "ArcheologiaHubAndroid/app/src/main/java/it/archeologia/hub/MainActivity.java" ]; then
            echo "ERRORE: MainActivity.java V25 non trovato."
            exit 1
          fi

          echo "V25 verificata correttamente."

      - name: Controllo progetto Gradle
        working-directory: ArcheologiaHubAndroid
        run: |
          echo "Gradle:"
          gradle --version

          echo "Verifico i task:"
          gradle tasks --no-daemon --stacktrace

      - name: Compila APK Debug V25
        working-directory: ArcheologiaHubAndroid
        run: |
          set -e

          echo "Pulizia build precedente..."
          gradle clean --no-daemon

          echo "Compilazione APK..."
          gradle assembleDebug --no-daemon --stacktrace

      - name: Verifica APK
        shell: bash
        run: |
          set -e

          APK="ArcheologiaHubAndroid/app/build/outputs/apk/debug/app-debug.apk"

          echo "Controllo APK..."

          if [ ! -f "$APK" ]; then
            echo "ERRORE: APK NON GENERATO."
            echo "File nella cartella build:"
            find ArcheologiaHubAndroid/app/build -type f | sort || true
            exit 1
          fi

          echo "======================================"
          echo "APK GENERATO CORRETTAMENTE"
          echo "======================================"

          ls -lh "$APK"

      - name: Carica APK
        uses: actions/upload-artifact@v4
        with:
          name: Archeologia-Hub-V25-APK
          path: ArcheologiaHubAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
