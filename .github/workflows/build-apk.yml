name: Build Archeologia Hub APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    name: Compila Archeologia Hub V24
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Find and extract V24 project
        shell: bash
        run: |
          set -e

          ZIP="$(find . -maxdepth 1 -type f -name 'Archeologia_Hub_V24_TRANSCRIZIONE_REALE.zip' -print -quit)"

          if [ -z "$ZIP" ]; then
            echo "ERRORE: Archeologia_Hub_V24_TRANSCRIZIONE_REALE.zip non trovato."
            echo "File presenti:"
            ls -la
            exit 1
          fi

          echo "ZIP trovato: $ZIP"
          rm -rf ArcheologiaHubAndroid
          unzip -q -o "$ZIP"

          if [ ! -f "ArcheologiaHubAndroid/settings.gradle" ]; then
            echo "ERRORE: progetto Android V24 non trovato."
            find . -maxdepth 4 -type f | sort
            exit 1
          fi

          echo "Progetto V24 pronto:"
          find ArcheologiaHubAndroid -maxdepth 5 -type f | sort

      - name: Check Gradle project
        working-directory: ArcheologiaHubAndroid
        run: |
          gradle --version
          gradle tasks --no-daemon --stacktrace

      - name: Build debug APK
        working-directory: ArcheologiaHubAndroid
        run: |
          gradle clean assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="ArcheologiaHubAndroid/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERRORE: APK non generato."
            find ArcheologiaHubAndroid/app/build -type f | sort || true
            exit 1
          fi

          echo "APK generato correttamente:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Archeologia-Hub-V24-APK
          path: ArcheologiaHubAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
